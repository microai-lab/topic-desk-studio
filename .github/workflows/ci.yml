# Validate every branch update and pull request before it can be considered releasable.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend unit tests and type checks
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Verify production frontend build
        run: pnpm build

  rust:
    name: Rust tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Tauri's Linux WebView bindings are linked even by native unit-test binaries.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust checks
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Reject Rust warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
