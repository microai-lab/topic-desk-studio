# Each installer is built on its native operating system because Tauri does not cross-bundle all targets.
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Linux WebKit and packaging libraries are supplied by the runner, not embedded in the app.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native installers
        run: pnpm tauri build ${{ matrix.args }}

      # Upload every native bundle without assuming code-signing or release credentials exist.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: topic-desk-studio-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
