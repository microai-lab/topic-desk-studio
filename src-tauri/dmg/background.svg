<!-- Source artwork for the branded macOS DMG background. Export to background.png after edits. -->
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <defs>
    <linearGradient id="canvas" x1="28" y1="20" x2="690" y2="425" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFAF6"/>
      <stop offset="0.52" stop-color="#F5F4EE"/>
      <stop offset="1" stop-color="#EEF3EF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="302" y1="237" x2="418" y2="237" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6532B"/>
      <stop offset="1" stop-color="#2B8068"/>
    </linearGradient>
    <radialGradient id="orangeGlow">
      <stop stop-color="#ED6A43" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ED6A43" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow">
      <stop stop-color="#2B8068" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2B8068" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1F251F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="url(#canvas)"/>
  <circle cx="694" cy="-8" r="180" fill="url(#orangeGlow)"/>
  <circle cx="22" cy="434" r="210" fill="url(#greenGlow)"/>
  <path d="M0 373C128 334 194 430 335 393C465 359 538 297 720 334V440H0Z" fill="#FFFFFF" fill-opacity="0.36"/>

  <g transform="translate(42 34)">
    <rect width="28" height="28" rx="8" fill="#242720"/>
    <rect x="7" y="7" width="14" height="3" rx="1.5" fill="#E6532B"/>
    <rect x="7" y="12.5" width="14" height="3" rx="1.5" fill="#E6532B"/>
    <rect x="7" y="18" width="9" height="3" rx="1.5" fill="#E6532B"/>
    <circle cx="19.5" cy="19.5" r="2.3" fill="#2B8068"/>
  </g>
  <text x="82" y="53" fill="#242720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="20" font-weight="650" letter-spacing="-0.25">Topic Desk Studio</text>
  <text x="82" y="74" fill="#777A73" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.25">YOUR LOCAL-FIRST TREND WORKSPACE</text>
  <line x1="42" y1="98" x2="678" y2="98" stroke="#242720" stroke-opacity="0.08"/>

  <text x="360" y="133" text-anchor="middle" fill="#242720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Drag to Applications</text>
  <text x="360" y="153" text-anchor="middle" fill="#858880" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11.5">拖动应用图标即可完成安装</text>

  <g filter="url(#shadow)">
    <rect x="110" y="178" width="160" height="146" rx="28" fill="#FFFFFF" fill-opacity="0.67" stroke="#FFFFFF" stroke-opacity="0.84"/>
    <rect x="450" y="178" width="160" height="146" rx="28" fill="#FFFFFF" fill-opacity="0.67" stroke="#FFFFFF" stroke-opacity="0.84"/>
  </g>
  <circle cx="190" cy="244" r="63" fill="#E6532B" fill-opacity="0.055"/>
  <circle cx="530" cy="244" r="63" fill="#2B8068" fill-opacity="0.055"/>

  <path d="M305 240H408" stroke="url(#arrow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M394 226L410 240L394 254" fill="none" stroke="#2B8068" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="324" cy="240" r="3" fill="#E95F38"/>
  <circle cx="344" cy="240" r="3" fill="#C96745"/>
  <circle cx="364" cy="240" r="3" fill="#8B7353"/>
  <circle cx="384" cy="240" r="3" fill="#557A60"/>

  <text x="360" y="371" text-anchor="middle" fill="#5E625B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12">Discover · Track · Create</text>
  <text x="360" y="394" text-anchor="middle" fill="#94978F" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="10.5">Private by design · Data stays on your device</text>
</svg>
