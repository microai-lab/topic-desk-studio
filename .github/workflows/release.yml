# Each installer is built on its native operating system because Tauri does not cross-bundle all targets.
name: build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Build jobs only need source access; the release job receives write permission separately.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          # macOS 13 runners were retired; this label preserves the Intel package.
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Linux WebKit and packaging libraries are supplied by the runner, not embedded in the app.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native installers
        run: pnpm tauri build ${{ matrix.args }}
        # Tauri otherwise skips the Finder background and icon layout on CI.
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ startsWith(matrix.platform, 'macos-') && 'true' || 'false' }}

      # Upload every native bundle without assuming code-signing or release credentials exist.
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: topic-desk-studio-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          # Installers are already compressed, so recompression only wastes runner time.
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Versioned notes keep the product summary bilingual while GitHub appends the commit changelog.
      - name: Check out release notes
        uses: actions/checkout@v7

      # A separate job ensures the release is published only after every native build succeeds.
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: topic-desk-studio-*
          path: release-assets
          merge-multiple: true

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.rpm
