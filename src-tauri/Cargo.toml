[package]
name = "topic-desk-studio"
version = "0.2.3"
description = "Independent local-first trend curation desktop application"
authors = ["MicroAI Lab"]
edition = "2021"

[lib]
name = "topic_desk_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = "0.22"
encoding_rs = "0.8"
feed-rs = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["formatting"] }
unicode-normalization = "0.1"
url = "2"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSError"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
block2 = "0.6"
